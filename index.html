<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ed4d8a"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png">
<title>Meu Treino</title>
<style>
:root{--pink:#ed4d8a;--pink2:#ff7eaa;--pink-light:#fde7f0;--navy:#111b36;--beige:#f7f7fa;--paper:#fff;--line:#e1e2e9;--ink:#111b36;--muted:#606a80}
*{box-sizing:border-box}body{margin:0;background:var(--beige);color:var(--ink);font:16px/1.4 system-ui,-apple-system,BlinkMacSystemFont,sans-serif;padding:env(safe-area-inset-top) 10px calc(88px + env(safe-area-inset-bottom))}
main{max-width:680px;margin:auto;padding:14px 0 22px}button,input{font:inherit}button{cursor:pointer;border:0;border-radius:13px;padding:10px 13px}
.top{display:flex;justify-content:space-between;align-items:center}.eyebrow,.muted{font-size:12px;color:var(--muted)}
h1{font-size:27px;margin:3px 0;font-weight:850;letter-spacing:-.8px}h2{font-size:25px;margin:3px 0;letter-spacing:-.6px}h3{margin:0;font-size:16px;font-weight:800}
.hero{background:#fff;color:var(--navy);padding:17px 16px;border-radius:22px;margin:14px 0;border:1px solid var(--line);box-shadow:0 3px 14px #111b3608}
.days{display:flex;gap:6px;overflow:auto;margin:15px 0 20px;padding-bottom:3px}.day{background:#f1f0f4;color:var(--navy);border:1px solid transparent;min-width:68px;flex:1;font-weight:700}.day.active,.primary{background:linear-gradient(140deg,#ffafd0,#f46d9e);color:#111b36}
.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:13px;margin:9px 0;box-shadow:0 2px 9px #111b3605}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.tag{font-size:11px;background:var(--pink-light);padding:5px 8px;border-radius:20px;color:#a31955;font-weight:700}
.guide{font-size:13px;line-height:1.55;color:#424c63;margin:12px 0}.sets{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}.set{background:#f8f7fa;border:1px solid #dedfe8;font-size:12px;color:var(--navy)}.set.done{background:var(--pink);color:white;border-color:var(--pink)}
.load{width:100%;border:1px solid #dedfe8;background:#fff;border-radius:12px;padding:10px;color:var(--ink);margin:7px 0}.link{color:#b83268;font-size:13px;font-weight:700;text-decoration:none}
.progress{height:7px;background:#ecebf1;border-radius:9px;overflow:hidden;margin:10px 0}.bar{height:100%;background:var(--pink)}.secondary{background:var(--pink-light);color:#a3295b}
.footer{display:flex;justify-content:space-between;gap:8px;margin:15px 0}.history{font-size:13px;line-height:1.6}.notice{font-size:12px;color:#697286;margin:10px 2px}
.exercise-art{width:100%;height:220px;object-fit:contain;background:linear-gradient(135deg,#fff8fb,#f4f4f8);border-radius:17px;margin:12px 0 8px;display:block}
.ex-title{display:flex;align-items:center;gap:10px}.mini-art{width:78px;height:66px;object-fit:contain;background:#f8f2f6;border-radius:13px;flex-shrink:0}
.exercise-list{border:1px solid var(--line);border-radius:17px;padding:4px 10px;background:white}
.exercise-list .card{border:0;border-bottom:1px solid var(--line);border-radius:0;margin:0;padding:9px 0;box-shadow:none}.exercise-list .card:last-child{border-bottom:0}
.bottom-nav{position:fixed;z-index:5;bottom:0;left:0;right:0;background:#ffffffed;backdrop-filter:blur(12px);border:1px solid #e5e5eb;border-radius:22px 22px 0 0;padding:9px 10px calc(8px + env(safe-area-inset-bottom));display:flex;justify-content:space-around;max-width:680px;margin:auto}
.bottom-nav button{background:transparent;color:#555d6e;display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 12px;font-size:11px}.bottom-nav button.active{color:var(--pink);font-weight:800}.bottom-nav .navicon{font-size:21px;line-height:1}
.detail-head{display:flex;align-items:center;justify-content:space-between;gap:10px}.detail-head h2{text-align:center;flex:1;font-size:22px}.pink-banner{background:linear-gradient(100deg,#fde7f0,#fff0f6);color:#a31955;font-weight:850;border-radius:15px;padding:13px;display:flex;gap:12px;align-items:center;margin:10px 0}
.step{display:flex;gap:10px;margin:10px 0;font-size:14px;line-height:1.35}.stepnum{flex:0 0 27px;height:27px;border-radius:50%;background:linear-gradient(140deg,#ff9fc4,#ed4d8a);color:#fff;font-weight:800;display:grid;place-items:center}
.tip{background:#fde7f0;color:#30384c;border-radius:15px;padding:12px;font-size:13px;margin:12px 0}.setrow{display:flex;align-items:center;gap:9px;padding:10px 5px;border-bottom:1px solid var(--line)}.setrow:last-child{border-bottom:0}.setrow input[type=checkbox]{width:22px;height:22px;accent-color:var(--pink)}.setrow label{flex:1;font-weight:750}
@media(min-width:620px){main{padding-top:22px}.exercise-art{height:250px}}
 
.home-summary{display:flex;align-items:end;justify-content:space-between;margin:22px 2px 12px}.home-summary h2{font-size:24px;margin:2px 0}.exercise-list{border:1px solid var(--line);border-radius:16px;background:#fff;padding:4px 9px}.exercise-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer;min-height:76px}.exercise-row:last-child{border-bottom:0}.mini-art{width:74px;height:62px;object-fit:contain;border-radius:12px;background:#f8f2f6;flex-shrink:0}.exercise-copy{flex:1;min-width:0;font-size:13px;color:#222b40}.exercise-copy h3{font-size:14px;line-height:1.2;margin-bottom:4px}.chevron{font-size:26px;color:#343b4b;padding:0 3px}.exercise-detail[hidden]{display:none}.detail-title{display:flex;align-items:center;gap:8px}.detail-title h2{flex:1;text-align:center;font-size:20px}.heart{font-size:26px;color:var(--pink)}.bottom-nav{position:fixed;bottom:0;left:0;right:0;max-width:680px;margin:auto;display:flex;justify-content:space-around;background:#ffffffed;backdrop-filter:blur(12px);border:1px solid #e2e3e9;border-radius:20px 20px 0 0;padding:8px 4px calc(8px + env(safe-area-inset-bottom));z-index:8}.bottom-nav button{background:transparent;color:#505767;display:flex;flex-direction:column;align-items:center;font-size:11px;padding:3px 8px;gap:1px}.bottom-nav button.active{color:var(--pink);font-weight:800}.bottom-nav b{font-size:20px;line-height:1}.days{margin-bottom:22px}.day{min-width:57px;padding:8px 6px;font-size:12px}.day.active{background:#ffb6d1;color:#101a34}
</style></head>
<body><main>
<header class="top"><div><div class="eyebrow">SEU GUIA DE MUSCULAÇÃO</div><h1>Meu Treino <span style="display:inline-block;background:#fde7f0;color:#ed4d8a;border-radius:12px;padding:4px 8px;font-size:20px">✣</span></h1></div><div style="font-size:25px;color:#18233d">⚙</div></header>
<div class="hero"><div style="font-size:11px;letter-spacing:1px;color:#606a80">TREINO DO DIA</div><strong style="font-size:24px;display:block;margin:5px 0">Sua rotina, no seu ritmo</strong><div style="font-size:13px;color:#606a80">5 dias · força · constância</div></div>
<nav class="days" id="days"></nav><section id="content"></section><section class="card"><div class="row"><h3>Histórico de treinos</h3><button class="secondary" id="historyBtn">Ver histórico</button></div><div id="history" class="history" hidden></div></section>
<div class="notice">Se estiver retornando após pausa, comece leve. Use cargas controladas e ajuste os exercícios com sua personal. O registro fica salvo neste aparelho/navegador.</div>
</main>
<script>
const W=[
{day:"SEG",name:"Quadríceps + glúteos",items:[
["Cadeira extensora",3,12,15,60,"Quadríceps","Ajuste encosto e rolo. Mantenha costas apoiadas, estenda os joelhos e segure 1–2 s no topo. Desça devagar."],
["Leg 45°",3,10,12,90,"Quadríceps e glúteos","Apoie as costas. Desça sem tirar o quadril do banco. Empurre sem travar os joelhos."],
["Hack machine",3,10,12,90,"Quadríceps e glúteos","Costas apoiadas, desça com controle e amplitude confortável; joelhos acompanham os pés."],
["Cadeira abdutora",3,12,15,60,"Glúteo médio","Incline levemente o tronco, abra os joelhos e segure 2 s. Evite impulso."],
["Leg horizontal unilateral",3,10,10,90,"Pernas","Faça uma perna por vez, pelve estável e mesmo número de repetições nos dois lados."]]},
{day:"TER",name:"Superiores A",items:[
["Puxada pegada aberta",3,10,12,90,"Costas","Puxe em direção à parte superior do peito, cotovelos para baixo; não puxe atrás da cabeça."],
["Remada baixa unilateral",3,10,12,75,"Costas","Tronco estável, cotovelo para trás sem girar o corpo."],
["Supino articulado",3,10,12,75,"Peito e tríceps","Alças na altura do peito; empurre sem elevar os ombros e retorne controlando."],
["Desenvolvimento máquina",3,10,12,75,"Ombros","Costas apoiadas, empurre para cima sem arquear a lombar."],
["Rosca martelo",3,10,12,60,"Bíceps","Palmas voltadas uma para outra. Flexione cotovelos sem balançar."],
["Tríceps pulley corda",3,10,12,60,"Tríceps","Cotovelos junto ao corpo; estenda e controle a volta."]]},
{day:"QUA",name:"Posterior + glúteos",items:[
["Flexora sentada",3,12,15,60,"Posterior","Flexione os joelhos com controle e retorne sem deixar a carga cair."],
["Stiff com barra",3,8,10,120,"Posterior e glúteos","Quadril para trás, coluna neutra, joelhos levemente flexionados. Desça até manter boa técnica."],
["Búlgaro com apoio",3,10,10,90,"Glúteos e quadríceps","Use apoio. Desça com controle, joelho alinhado com o pé."],
["Agachamento sumô kettlebell",3,10,12,90,"Glúteos e pernas","Pés afastados, kettlebell próximo do corpo, joelhos seguindo os pés."],
["Cadeira abdutora",3,12,15,60,"Glúteo médio","Incline levemente o tronco, abra com controle e segure brevemente."]]},
{day:"QUI",name:"Superiores B",items:[
["Desenvolvimento máquina",3,10,12,75,"Ombros","Empurre para cima com controle, sem arquear a lombar."],
["Elevação lateral na polia",3,12,15,60,"Ombros","Eleve lateralmente até altura confortável, sem impulso."],
["Supino articulado declinado",3,10,12,75,"Peito e tríceps","Ombros apoiados; empurre sem travar cotovelos."],
["Remada alta com barra",3,10,12,75,"Costas e ombros","Tronco estável e amplitude confortável. Se incomodar, troque por face pull com orientação."],
["Tríceps máquina",3,10,12,60,"Tríceps","Ajuste a máquina e estenda os cotovelos controlando o movimento."],
["Rosca bíceps na polia",3,10,12,60,"Bíceps","Cotovelos próximos ao corpo; evite balançar o tronco."],
["Pulldown com corda",3,12,15,60,"Costas","Puxe a corda para baixo com controle, tronco estável."]]},
{day:"SEX",name:"Glúteos + quadríceps",items:[
["Elevação pélvica",3,10,12,120,"Glúteo máximo","Costas apoiadas no banco; eleve o quadril, segure 1–2 s sem hiperestender a lombar."],
["Terra sumô",3,10,12,120,"Glúteos e pernas","Pés afastados, coluna neutra, abdômen firme. Estenda o quadril sem inclinar para trás."],
["Glúteo coice máquina",3,12,15,60,"Glúteos","Empurre para trás sem girar o quadril ou arquear a lombar."],
["Cadeira abdutora",3,12,15,60,"Glúteo médio","Abra as pernas com controle e segure brevemente."],
["Cadeira extensora",3,12,15,60,"Quadríceps","Estenda os joelhos com controle e retorne lentamente."]]}];
const imageMap = {
"Cadeira extensora":"extensora",\n"Leg 45°":"leg_press",\n"Hack machine":"hack",\n"Cadeira abdutora":"abdutora",\n"Leg horizontal unilateral":"leg_unilateral",\n"Puxada pegada aberta":"puxada",\n"Remada baixa unilateral":"remada",\n"Supino articulado":"supino",\n"Desenvolvimento máquina":"desenvolvimento",\n"Rosca martelo":"rosca_martelo",\n"Tríceps pulley corda":"triceps_polia",\n"Flexora sentada":"flexora_sentada",\n"Stiff com barra":"stiff",\n"Búlgaro com apoio":"bulgaro",\n"Agachamento sumô kettlebell":"sumo_kb",\n"Elevação lateral na polia":"lateral_polia",\n"Supino articulado declinado":"supino_declinado",\n"Remada alta com barra":"remada_alta",\n"Tríceps máquina":"triceps_maquina",\n"Rosca bíceps na polia":"rosca_polia",\n"Pulldown com corda":"pulldown_corda",\n"Elevação pélvica":"hip_thrust",\n"Terra sumô":"terra_sumô",\n"Glúteo coice máquina":"triceps_maquina"
};
function exerciseIllustration(name, cls="exercise-art"){
 const file=imageMap[name] || "leg_press";
 return `<img class="${cls}" src="assets/${file}.webp" alt="Ilustração de referência: ${name}" loading="lazy">`;
}

let day=0;const $=id=>document.getElementById(id);const storeKey="meuTreinoDataV5";let data={};
try{data=JSON.parse(localStorage.getItem(storeKey)||"{}")}catch(e){}
function save(){localStorage.setItem(storeKey,JSON.stringify(data))}
function key(d,i){return d+"_"+i}
function get(d,i){return data[key(d,i)]||{done:[],loads:[]}}
function render(){
$("days").innerHTML=W.map((w,i)=>`<button class="day ${day===i?"active":""}" data-day="${i}">${w.day}</button>`).join("");
$("days").querySelectorAll("button").forEach(b=>b.onclick=()=>{day=+b.dataset.day;render()});
let w=W[day],all=w.items.reduce((a,x)=>a+x[1],0),done=w.items.reduce((a,x,i)=>a+get(day,i).done.filter(Boolean).length,0);
$("content").innerHTML=`<div class="home-summary"><div><div class="muted">Treino do dia</div><h2>${w.name}</h2></div><div class="muted">◷ ~ 60–75 min</div></div><div class="progress"><div class="bar" style="width:${100*done/all}%"></div></div><div class="exercise-list">`+
w.items.map((x,i)=>{let g=get(day,i);while(g.done.length<x[1])g.done.push(false);return `<article class="exercise-row" data-open-ex="${i}">${exerciseIllustration(x[0],"mini-art")}<div class="exercise-copy"><h3>${x[0]}</h3><div>${x[1]} séries × ${x[2]}–${x[3]} repetições</div></div><span class="chevron">›</span></article><section class="exercise-detail card" id="detail-${i}" hidden><div class="detail-title"><button class="secondary" data-back="${i}">‹ Voltar</button><h2>${x[0]}</h2><span class="heart">♡</span></div>${exerciseIllustration(x[0])}<div class="pink-banner">▱　${x[1]} séries × ${x[2]}–${x[3]} repetições</div><h3>Como executar</h3><div class="guide">${x[6]}</div><div class="tip"><b>Principais músculos</b><br>${x[5]}<br><b>Dica:</b> priorize movimento controlado e postura confortável.</div><h3> Séries </h3>${g.done.map((v,j)=>`<div class="setrow"><label>Série ${j+1}</label><span>${x[2]}–${x[3]} repetições</span><input type="checkbox" data-ex="${i}" data-s="${j}" ${v?"checked":""}></div>`).join("")}<label class="muted">Carga (kg)</label><input class="load" data-load="${i}" placeholder="Ex.: 25 kg" value="${g.loads[0]||""}"><a class="link" target="_blank" rel="noopener" href="https://www.youtube.com/results?search_query=${encodeURIComponent(x[0]+" execução exercício")}">▶ Buscar vídeo de execução</a></section>`}).join("")+
`</div><div class="footer"><button class="secondary" id="clearDay">Limpar dia</button><button class="primary" id="nextDay">${day===4?"Concluir semana":"Próximo dia →"}</button></div>`;
$("content").querySelectorAll("[data-open-ex]").forEach(row=>row.onclick=()=>{const i=+row.dataset.openEx;document.querySelectorAll(".exercise-row").forEach(r=>r.hidden=true);document.querySelectorAll(".exercise-detail").forEach(d=>d.hidden=true);const panel=$("detail-"+i);panel.hidden=false;panel.scrollIntoView({behavior:"smooth",block:"start"});});
$("content").querySelectorAll("[data-back]").forEach(b=>b.onclick=()=>{document.querySelectorAll(".exercise-row").forEach(r=>r.hidden=false);document.querySelectorAll(".exercise-detail").forEach(d=>d.hidden=true);});
$("content").querySelectorAll("[data-ex]").forEach(b=>b.onchange=()=>{let g=get(day,+b.dataset.ex);g.done[+b.dataset.s]=b.checked;data[key(day,+b.dataset.ex)]=g;save();});
$("content").querySelectorAll("[data-load]").forEach(inp=>inp.onchange=()=>{let g=get(day,+inp.dataset.load);g.loads[0]=inp.value;data[key(day,+inp.dataset.load)]=g;save()});
$("clearDay").onclick=()=>{w.items.forEach((x,i)=>delete data[key(day,i)]);save();render()};
$("nextDay").onclick=()=>{if(day<4){day++;render()}else{save();alert("Semana concluída! Confira o histórico abaixo.")}};
}
$("historyBtn").onclick=()=>{let h=$("history");h.hidden=!h.hidden;if(!h.hidden){let entries=[];W.forEach((w,d)=>w.items.forEach((x,i)=>{let g=get(d,i);if(g.done.some(Boolean)||g.loads.some(Boolean))entries.push(`${w.day} — ${x[0]}: ${g.done.filter(Boolean).length}/${x[1]} séries; carga ${g.loads[0]||"não anotada"}`)}));h.innerHTML=entries.length?entries.join("<br>"):"Ainda não há registros. Marque séries e anote cargas durante seus treinos."}};
render();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script></body></html>
